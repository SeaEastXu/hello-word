name: Build E108 v0.6.0A Native HAL Proxy
on:
  push:
    branches: [ e108-build-v0.6.0a ]
    paths:
      - 'native_hal/**'
      - '.github/workflows/build-e108-v060a-native.yml'
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Build arm64 gps.default.so proxy
        shell: bash
        run: |
          set -euxo pipefail
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOL/aarch64-linux-android33-clang"
          STRIP="$TOOL/llvm-strip"
          READELF="$TOOL/llvm-readelf"
          NM="$TOOL/llvm-nm"
          mkdir -p out
          "$CC" -std=c11 -shared -fPIC -O2 -fvisibility=hidden \
            -include native_hal/proxy_prefix.h \
            native_hal/gps_proxy.c \
            -Wl,-soname,gps.default.so -llog -ldl \
            -o out/gps.default.so
          "$STRIP" --strip-unneeded out/gps.default.so
          "$READELF" -h out/gps.default.so
          "$READELF" -d out/gps.default.so
          "$NM" -D out/gps.default.so | grep -E ' HMI$'
          file out/gps.default.so
          sha256sum out/gps.default.so | tee out/SHA256SUMS.txt
          cp native_hal/gps_proxy.c out/gps_proxy.c
          cp native_hal/proxy_prefix.h out/proxy_prefix.h
          cat > out/BUILD_INFO.txt <<'EOF'
          E108 GNSS Native HAL Proxy v0.6.0A
          Target: arm64-v8a / Android API 33
          Purpose: transparent proxy of stock gps.default.so + legacy gps_measurement extension exposure.
          This A build intentionally does NOT emit GnssData yet.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: E108-Native-HAL-Proxy-v0.6.0A
          path: out/
          if-no-files-found: error
