name: Build E108 v0.6.0B Raw GNSS HAL
on:
  push:
    branches: [ e108-build-v0.6.0b ]
    paths:
      - 'source_parts/v060b_*.b64'
      - '.github/workflows/build-e108-v060b-native.yml'
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and verify
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p native_hal out
          cat source_parts/v060b_00.b64 source_parts/v060b_01a.b64 source_parts/v060b_01b.b64 source_parts/v060b_02.b64 > /tmp/gps_proxy_raw.cpp.b64
          test "$(wc -c </tmp/gps_proxy_raw.cpp.b64)" = "40188"
          base64 -d /tmp/gps_proxy_raw.cpp.b64 > native_hal/gps_proxy_raw.cpp
          test "$(wc -c <native_hal/gps_proxy_raw.cpp)" = "30141"
          sha256sum native_hal/gps_proxy_raw.cpp | tee out/SOURCE_SHA256.txt
          grep -q 'E108 GNSS RTCM-MSM7 Raw HAL v0.6.0B' native_hal/gps_proxy_raw.cpp

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Build arm64 Raw GNSS legacy HAL
        shell: bash
        run: |
          set -euxo pipefail
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOL/aarch64-linux-android33-clang++"
          STRIP="$TOOL/llvm-strip"
          READELF="$TOOL/llvm-readelf"
          NM="$TOOL/llvm-nm"
          "$CXX" -std=c++17 -shared -fPIC -O2 -fvisibility=hidden -static-libstdc++ \
            native_hal/gps_proxy_raw.cpp \
            -Wl,-soname,gps.default.so -Wl,--exclude-libs,ALL \
            -llog -ldl -lm -pthread \
            -o out/gps.default.so
          "$STRIP" --strip-unneeded out/gps.default.so
          "$READELF" -h out/gps.default.so
          "$READELF" -d out/gps.default.so | tee out/DYNAMIC.txt
          "$NM" -D out/gps.default.so | grep -E ' HMI$'
          ! grep -q 'libc++_shared.so' out/DYNAMIC.txt
          file out/gps.default.so
          sha256sum out/gps.default.so | tee out/SHA256SUMS.txt
          cp native_hal/gps_proxy_raw.cpp out/gps_proxy_raw.cpp
          cat > out/BUILD_INFO.txt <<'EOF'
          E108 GNSS Native HAL v0.6.0B Raw1
          Target: UIS7870 / Android 13 / arm64 / legacy GPS ABI 88 bytes.
          Raw input: /dev/ttyE108 RTCM3 MSM7.
          Output: legacy GpsMeasurementInterface GnssData/GnssClock callbacks.
          Constellations enabled initially: GPS, GLONASS, Galileo, QZSS, BeiDou.
          NavIC MSM7 is decoded but not emitted in Raw1 pending target-HIDL mapping verification.
          Location/SV/NMEA and private extensions are still delegated to verified stock gps.stock.so.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: E108-Native-Raw-GNSS-v0.6.0B
          path: out/
          if-no-files-found: error
