name: Build E108 v0.5.0 APK
on:
  push:
    branches: [ e108-build-v0.5.0 ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk E108_GNSS_Debug_v0.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: E108-GNSS-Debug-v0.5.0
          path: E108_GNSS_Debug_v0.5.0.apk
          if-no-files-found: error
