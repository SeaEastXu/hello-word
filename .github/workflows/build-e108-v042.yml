name: Build E108 v0.4.2 APK
on:
  push:
    branches: [ e108-build-v0.4.2 ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          unzip -q E108_0x55002613_UnifiedTest_v0.4.2-source.zip -d src
          cd src/debug-app
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../E108_GNSS_Debug_v0.4.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: E108-GNSS-Debug-v0.4.2
          path: E108_GNSS_Debug_v0.4.2.apk
